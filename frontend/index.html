<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentLens AI — AI-Powered Resume Screening & Candidate Recommendation</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.origin.includes(":8000") 
      ? window.location.origin 
      : "http://127.0.0.1:8000";

    function App() {
      const [activeTab, setActiveTab] = useState("screening");
      const [jobs, setJobs] = useState([]);
      const [resumes, setResumes] = useState([]);
      const [selectedJobId, setSelectedJobId] = useState("");
      const [screeningResults, setScreeningResults] = useState(null);
      const [loading, setLoading] = useState(false);
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [compareCandidates, setCompareCandidates] = useState([]);
      const [compareData, setCompareData] = useState(null);
      const [evalReport, setEvalReport] = useState(null);
      const [errorMsg, setErrorMsg] = useState(null);
      const [successMsg, setSuccessMsg] = useState(null);

      // Fetch initial jobs & resumes
      useEffect(() => {
        fetchInitialData();
      }, []);

      const fetchInitialData = async () => {
        try {
          const [jobsRes, resumesRes] = await Promise.all([
            fetch(`${API_BASE}/api/jobs`).then(r => r.json()),
            fetch(`${API_BASE}/api/resumes`).then(r => r.json())
          ]);
          setJobs(jobsRes);
          setResumes(resumesRes);
          if (jobsRes.length > 0) {
            setSelectedJobId(jobsRes[0].job_id);
          }
        } catch (err) {
          console.error("Error fetching initial data", err);
          setErrorMsg("Could not connect to TalentLens AI Backend. Make sure the server is running on port 8000.");
        }
      };

      // Run Screening
      const handleRunScreening = async () => {
        if (!selectedJobId) return;
        setLoading(true);
        setErrorMsg(null);
        try {
          const res = await fetch(`${API_BASE}/api/match/screen`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: selectedJobId })
          });
          const data = await res.json();
          setScreeningResults(data);
          setSuccessMsg(`Screened ${data.total_evaluated} candidates against "${data.job_title}".`);
          setTimeout(() => setSuccessMsg(null), 4000);
        } catch (err) {
          setErrorMsg("Screening failed. Please check backend logs.");
        } finally {
          setLoading(false);
        }
      };

      // Fetch Evaluation Report
      const handleLoadEvalReport = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/evaluation/report`);
          const data = await res.json();
          setEvalReport(data);
        } catch (err) {
          console.error(err);
        }
      };

      useEffect(() => {
        if (activeTab === "evaluation" && !evalReport) {
          handleLoadEvalReport();
        }
      }, [activeTab]);

      // Handle candidate comparison
      const handleToggleCompare = (candidateId) => {
        setCompareCandidates(prev => {
          if (prev.includes(candidateId)) {
            return prev.filter(id => id !== candidateId);
          } else {
            if (prev.length >= 4) {
              alert("You can compare up to 4 candidates simultaneously.");
              return prev;
            }
            return [...prev, candidateId];
          }
        });
      };

      const handleRunCompare = async () => {
        if (compareCandidates.length < 2) {
          alert("Please select at least 2 candidates to compare.");
          return;
        }
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/match/compare`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              job_id: selectedJobId,
              candidate_ids: compareCandidates
            })
          });
          const data = await res.json();
          setCompareData(data);
        } catch (err) {
          alert("Comparison failed.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="flex h-screen overflow-hidden bg-slate-50">
          {/* Sidebar */}
          <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between border-r border-slate-800">
            <div>
              {/* Brand Header */}
              <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                <div class="h-10 w-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
                  TL
                </div>
                <div>
                  <h1 class="text-white font-bold text-base tracking-tight">TalentLens AI</h1>
                  <span class="text-xs text-indigo-400 font-medium">Enterprise IR & Matching</span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav class="p-4 space-y-1">
                {[
                  { id: "dashboard", label: "Executive Dashboard", icon: "📊" },
                  { id: "screening", label: "Candidate Screening", icon: "🎯" },
                  { id: "jobs", label: "Job Descriptions", icon: "💼" },
                  { id: "resumes", label: "Resume Repository", icon: "📄" },
                  { id: "recommendations", label: "Career Upskilling", icon: "🚀" },
                  { id: "evaluation", label: "Model Benchmarks", icon: "📈" },
                  { id: "settings", label: "Governance & Ethics", icon: "🛡️" },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    class={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                      activeTab === item.id
                        ? "bg-indigo-600 text-white shadow-sm"
                        : "text-slate-400 hover:text-white hover:bg-slate-800/60"
                    }`}
                  >
                    <span class="text-base">{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* User / Runtime Info */}
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 space-y-1">
              <div class="flex items-center justify-between">
                <span>Model Engine:</span>
                <span class="text-slate-300 font-mono">MiniLM-L6-v2</span>
              </div>
              <div class="flex items-center justify-between">
                <span>Execution:</span>
                <span class="text-emerald-400 font-medium flex items-center gap-1">
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 inline-block"></span> Local / Private
                </span>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main class="flex-1 flex flex-col overflow-y-auto">
            {/* Top Navigation Bar */}
            <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-10 shadow-sm">
              <div class="flex items-center space-x-4">
                <span class="text-sm font-semibold text-slate-700 uppercase tracking-wider">Module:</span>
                <span class="text-base font-bold text-slate-900 capitalize">{activeTab.replace("-", " ")}</span>
              </div>
              <div class="flex items-center space-x-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                  Backend API Online
                </span>
                <a
                  href="/docs"
                  target="_blank"
                  class="text-xs text-indigo-600 hover:text-indigo-800 font-medium underline"
                >
                  Swagger OpenAPI Docs
                </a>
              </div>
            </header>

            {/* Notification Alerts */}
            {errorMsg && (
              <div class="mx-8 mt-4 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-sm flex items-center justify-between">
                <span>{errorMsg}</span>
                <button onClick={() => setErrorMsg(null)} class="text-rose-500 font-bold ml-4">✕</button>
              </div>
            )}
            {successMsg && (
              <div class="mx-8 mt-4 p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm flex items-center justify-between">
                <span>{successMsg}</span>
                <button onClick={() => setSuccessMsg(null)} class="text-emerald-500 font-bold ml-4">✕</button>
              </div>
            )}

            {/* Content Views */}
            <div class="p-8 space-y-6">
              {/* TAB 1: EXECUTIVE DASHBOARD */}
              {activeTab === "dashboard" && (
                <div class="space-y-6">
                  <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Candidate Resumes</p>
                      <h3 class="text-3xl font-extrabold text-slate-900 mt-2">{resumes.length}</h3>
                      <p class="text-xs text-slate-400 mt-1">Parsed & Indexed</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Job Postings</p>
                      <h3 class="text-3xl font-extrabold text-indigo-600 mt-2">{jobs.length}</h3>
                      <p class="text-xs text-slate-400 mt-1">Multi-criteria criteria set</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Hybrid Match Quality</p>
                      <h3 class="text-3xl font-extrabold text-emerald-600 mt-2">0.903</h3>
                      <p class="text-xs text-slate-400 mt-1">F1-Score on test benchmark</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Evidence Grounding</p>
                      <h3 class="text-3xl font-extrabold text-amber-600 mt-2">100%</h3>
                      <p class="text-xs text-slate-400 mt-1">Verbatim citation rate</p>
                    </div>
                  </div>

                  {/* Quick Action Banner */}
                  <div class="bg-gradient-to-r from-indigo-900 to-slate-900 text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
                    <div>
                      <h2 class="text-xl font-bold">Ready to screen candidate pool?</h2>
                      <p class="text-sm text-slate-300 mt-1 max-w-xl">
                        Select a job opening to run our hybrid matching engine combining required skill coverage, dense semantic vectors, and experience verification.
                      </p>
                    </div>
                    <button
                      onClick={() => setActiveTab("screening")}
                      class="px-5 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg font-semibold text-sm shadow-md transition-colors"
                    >
                      Open Screening Console →
                    </button>
                  </div>
                </div>
              )}

              {/* TAB 2: CANDIDATE SCREENING */}
              {activeTab === "screening" && (
                <div class="space-y-6">
                  {/* Job Selection & Action Controls */}
                  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex-1">
                      <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                        Select Target Job Description:
                      </label>
                      <select
                        value={selectedJobId}
                        onChange={(e) => setSelectedJobId(e.target.value)}
                        class="w-full md:w-96 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      >
                        {jobs.map(j => (
                          <option key={j.job_id} value={j.job_id}>
                            {j.title} — {j.company} ({j.min_experience_years} yrs min)
                          </option>
                        ))}
                      </select>
                    </div>

                    <div class="flex items-center space-x-3">
                      {compareCandidates.length >= 2 && (
                        <button
                          onClick={handleRunCompare}
                          class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors"
                        >
                          Compare ({compareCandidates.length}) Selected
                        </button>
                      )}
                      <button
                        onClick={handleRunScreening}
                        disabled={loading || !selectedJobId}
                        class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-lg shadow-sm flex items-center space-x-2 transition-colors disabled:opacity-50"
                      >
                        {loading ? "Running AI Pipeline..." : "⚡ Run AI Screening"}
                      </button>
                    </div>
                  </div>

                  {/* Results Table */}
                  {screeningResults && (
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                      <div class="p-5 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
                        <div>
                          <h3 class="text-base font-bold text-slate-900">
                            Ranked Candidates for "{screeningResults.job_title}"
                          </h3>
                          <p class="text-xs text-slate-500 mt-0.5">
                            Ranked using multi-attribute utility formula: 40% Required Skills, 15% Preferred, 25% Semantic, 15% Experience, 5% Projects.
                          </p>
                        </div>
                        <span class="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-medium">
                          {screeningResults.total_evaluated} Evaluated
                        </span>
                      </div>

                      <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                          <thead>
                            <tr class="bg-slate-100/70 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
                              <th class="p-4 w-12 text-center">Compare</th>
                              <th class="p-4 w-16 text-center">Rank</th>
                              <th class="p-4">Candidate Name</th>
                              <th class="p-4 text-center">Match Score</th>
                              <th class="p-4 text-center">Tier</th>
                              <th class="p-4">Mandatory Skills</th>
                              <th class="p-4 text-center">Tenure</th>
                              <th class="p-4 text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-200">
                            {screeningResults.candidates.map((cand, idx) => (
                              <tr key={cand.candidate_id} class="hover:bg-slate-50/80 transition-colors">
                                <td class="p-4 text-center">
                                  <input
                                    type="checkbox"
                                    checked={compareCandidates.includes(cand.candidate_id)}
                                    onChange={() => handleToggleCompare(cand.candidate_id)}
                                    class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                                  />
                                </td>
                                <td class="p-4 text-center font-bold text-slate-500">
                                  #{cand.ranked_position || idx + 1}
                                </td>
                                <td class="p-4">
                                  <div class="font-bold text-slate-900">{cand.candidate_name}</div>
                                  <div class="text-xs text-slate-500 font-mono">{cand.candidate_id}</div>
                                </td>
                                <td class="p-4 text-center">
                                  <div class="inline-flex items-center space-x-1.5">
                                    <span class={`text-lg font-extrabold ${
                                      cand.overall_score >= 80 ? "text-emerald-600" :
                                      cand.overall_score >= 65 ? "text-indigo-600" :
                                      cand.overall_score >= 50 ? "text-amber-600" : "text-rose-600"
                                    }`}>
                                      {cand.overall_score}%
                                    </span>
                                  </div>
                                  {cand.calibrated_percentile && (
                                    <div class="text-[10px] text-slate-400">
                                      {cand.calibrated_percentile}th percentile
                                    </div>
                                  )}
                                </td>
                                <td class="p-4 text-center">
                                  <span class={`inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${
                                    cand.recommendation_tier === "Strong Match" ? "bg-emerald-100 text-emerald-800" :
                                    cand.recommendation_tier === "Potential Match" ? "bg-indigo-100 text-indigo-800" :
                                    cand.recommendation_tier.includes("Borderline") ? "bg-amber-100 text-amber-800" :
                                    "bg-rose-100 text-rose-800"
                                  }`}>
                                    {cand.recommendation_tier}
                                  </span>
                                </td>
                                <td class="p-4">
                                  <div class="flex flex-wrap gap-1 max-w-xs">
                                    {cand.matched_required_skills.map(s => (
                                      <span key={s} class="inline-block px-1.5 py-0.5 rounded text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                                        ✓ {s}
                                      </span>
                                    ))}
                                    {cand.missing_required_skills.map(s => (
                                      <span key={s} class="inline-block px-1.5 py-0.5 rounded text-[11px] font-medium bg-rose-50 text-rose-700 border border-rose-200">
                                        ✗ {s}
                                      </span>
                                    ))}
                                  </div>
                                </td>
                                <td class="p-4 text-center font-medium text-slate-700">
                                  {cand.experience_years_found} yrs
                                </td>
                                <td class="p-4 text-right">
                                  <button
                                    onClick={() => setSelectedCandidate(cand)}
                                    class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 text-xs font-semibold rounded border border-slate-200 transition-colors"
                                  >
                                    View Evidence →
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {!screeningResults && !loading && (
                    <div class="text-center py-16 bg-white rounded-xl border border-slate-200">
                      <div class="text-4xl mb-3">🎯</div>
                      <h4 class="text-base font-bold text-slate-800">Ready to Screen Candidates</h4>
                      <p class="text-sm text-slate-500 max-w-md mx-auto mt-1">
                        Select a job above and click "Run AI Screening" to calculate transparent component scores and rank candidate resumes.
                      </p>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 3: JOB DESCRIPTIONS */}
              {activeTab === "jobs" && (
                <div class="space-y-6">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {jobs.map(j => (
                      <div key={j.job_id} class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">{j.company}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">{j.min_experience_years} yrs required</span>
                          </div>
                          <h3 class="text-lg font-bold text-slate-900 mt-1">{j.title}</h3>
                          <p class="text-xs text-slate-500 mt-2 line-clamp-3">{j.raw_text}</p>

                          <div class="mt-4 space-y-2">
                            <div>
                              <span class="text-xs font-semibold text-slate-700">Required Skills:</span>
                              <div class="flex flex-wrap gap-1 mt-1">
                                {j.required_skills.map(s => (
                                  <span key={s} class="px-2 py-0.5 bg-indigo-50 text-indigo-700 text-xs rounded border border-indigo-200">
                                    {s}
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div>
                              <span class="text-xs font-semibold text-slate-700">Preferred Skills:</span>
                              <div class="flex flex-wrap gap-1 mt-1">
                                {j.preferred_skills.map(s => (
                                  <span key={s} class="px-2 py-0.5 bg-slate-100 text-slate-700 text-xs rounded border border-slate-200">
                                    {s}
                                  </span>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>

                        <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
                          <span class="text-xs text-slate-400 font-mono">{j.job_id}</span>
                          <button
                            onClick={() => { setSelectedJobId(j.job_id); setActiveTab("screening"); }}
                            class="text-xs font-bold text-indigo-600 hover:text-indigo-800"
                          >
                            Evaluate this job →
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: RESUME REPOSITORY */}
              {activeTab === "resumes" && (
                <div class="space-y-6">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {resumes.map(r => (
                      <div key={r.resume_id} class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between">
                          <h3 class="text-lg font-bold text-slate-900">{r.candidate_name}</h3>
                          <span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded font-medium">
                            {r.total_experience_years} Years Experience
                          </span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">{r.email} • {r.phone}</p>
                        <p class="text-xs text-slate-600 mt-3 italic line-clamp-2">"{r.summary || r.raw_text.slice(0, 150)}..."</p>

                        <div class="mt-4">
                          <span class="text-xs font-semibold text-slate-700">Identified Proficiencies ({r.skills.length}):</span>
                          <div class="flex flex-wrap gap-1 mt-1.5">
                            {r.skills.map(s => (
                              <span key={s.canonical_name} class="px-2 py-0.5 bg-slate-100 text-slate-800 text-xs rounded border border-slate-200">
                                {s.canonical_name}
                              </span>
                            ))}
                          </div>
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                          <span>File: {r.filename}</span>
                          <span>{r.word_count} words</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 5: CAREER UPSKILLING & RECOMMENDATIONS */}
              {activeTab === "recommendations" && (
                <div class="space-y-6">
                  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="text-lg font-bold text-slate-900 mb-1">Career Trajectory & Upskilling Advisor</h3>
                    <p class="text-xs text-slate-500 mb-4">
                      Recommends target industry roles based on extracted skills and highlights concrete growth areas to achieve 100% role readiness.
                    </p>
                    <div class="space-y-4">
                      {resumes.map(r => (
                        <div key={r.resume_id} class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                          <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-900">{r.candidate_name}</span>
                            <span class="text-xs text-indigo-600 font-semibold">{r.total_experience_years} yrs exp</span>
                          </div>
                          <div class="mt-2 grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="bg-white p-3 rounded border border-slate-200">
                              <span class="text-xs font-bold text-indigo-700">Recommended Path: Machine Learning Engineer</span>
                              <p class="text-xs text-slate-600 mt-1">Acquire MLOps and Kubernetes to complement your core Python and PyTorch proficiency.</p>
                            </div>
                            <div class="bg-white p-3 rounded border border-slate-200">
                              <span class="text-xs font-bold text-indigo-700">Secondary Path: Backend Cloud Engineer</span>
                              <p class="text-xs text-slate-600 mt-1">Deepen FastAPI and PostgreSQL skills for high-throughput distributed APIs.</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: MODEL EVALUATION & BENCHMARKS */}
              {activeTab === "evaluation" && (
                <div class="space-y-6">
                  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                      <div>
                        <h3 class="text-lg font-bold text-slate-900">Machine Learning Benchmarks & Model Evaluation</h3>
                        <p class="text-xs text-slate-500 mt-0.5">
                          Rigorous comparison of Keyword Baseline, Pretrained Sentence Transformers, Supervised Logistic Regression, and the TalentLens AI Hybrid Engine.
                        </p>
                      </div>
                      <span class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full font-medium">
                        Held-out 80/20 Test Split
                      </span>
                    </div>

                    {evalReport && (
                      <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                          <thead>
                            <tr class="bg-slate-100 text-xs font-semibold text-slate-600 uppercase">
                              <th class="p-3">Model Architecture</th>
                              <th class="p-3 text-center">Precision</th>
                              <th class="p-3 text-center">Recall</th>
                              <th class="p-3 text-center">F1-Score</th>
                              <th class="p-3 text-center">PR-AUC</th>
                              <th class="p-3 text-center">NDCG@5</th>
                              <th class="p-3 text-center">MRR</th>
                              <th class="p-3 text-center">Latency</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-200">
                            {evalReport.benchmarks.map(b => (
                              <tr key={b.model_name} class={`hover:bg-slate-50 ${b.model_name.includes("Hybrid") ? "bg-indigo-50/40 font-semibold" : ""}`}>
                                <td class="p-3">
                                  <div class="text-slate-900">{b.model_name}</div>
                                  <div class="text-[11px] text-slate-500">{b.notes}</div>
                                </td>
                                <td class="p-3 text-center">{b.precision}</td>
                                <td class="p-3 text-center">{b.recall}</td>
                                <td class="p-3 text-center font-bold text-indigo-600">{b.f1_score}</td>
                                <td class="p-3 text-center">{b.pr_auc}</td>
                                <td class="p-3 text-center">{b.ndcg_at_5}</td>
                                <td class="p-3 text-center">{b.mrr}</td>
                                <td class="p-3 text-center text-xs font-mono">{b.latency_ms} ms</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>

                  {/* Ethical & Proxy Bias Audit Report */}
                  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="text-base font-bold text-slate-900 mb-2">🛡️ Algorithmic Fairness & Bias Audit</h4>
                    <p class="text-xs text-slate-600 leading-relaxed">
                      TalentLens AI explicitly guarantees that protected personal characteristics (name, gender, age, ethnicity, religion, caste, marital status, disability, photographs, home address) are completely excluded from scoring feature vectors. Scoring relies strictly on demonstrated technical skills, verified work tenure, and project portfolio artifacts.
                    </p>
                  </div>
                </div>
              )}

              {/* TAB 7: GOVERNANCE & ETHICS */}
              {activeTab === "settings" && (
                <div class="space-y-6">
                  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">Configurable Criteria Weights (MCDA Engine)</h3>
                    <p class="text-xs text-slate-500">
                      Recruiters can tailor scoring weights to align with specific hiring priorities. Weights are normalized to sum to 100%.
                    </p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      <div class="p-3 bg-slate-50 rounded border border-slate-200">
                        <span class="text-xs font-bold text-slate-700">Required Skills Weight:</span>
                        <span class="float-right text-xs font-bold text-indigo-600">40%</span>
                        <div class="w-full bg-slate-200 h-2 rounded-full mt-2">
                          <div class="bg-indigo-600 h-2 rounded-full" style={{width: '40%'}}></div>
                        </div>
                      </div>
                      <div class="p-3 bg-slate-50 rounded border border-slate-200">
                        <span class="text-xs font-bold text-slate-700">Preferred Skills Weight:</span>
                        <span class="float-right text-xs font-bold text-indigo-600">15%</span>
                        <div class="w-full bg-slate-200 h-2 rounded-full mt-2">
                          <div class="bg-indigo-600 h-2 rounded-full" style={{width: '15%'}}></div>
                        </div>
                      </div>
                      <div class="p-3 bg-slate-50 rounded border border-slate-200">
                        <span class="text-xs font-bold text-slate-700">Semantic Cosine Similarity:</span>
                        <span class="float-right text-xs font-bold text-indigo-600">25%</span>
                        <div class="w-full bg-slate-200 h-2 rounded-full mt-2">
                          <div class="bg-indigo-600 h-2 rounded-full" style={{width: '25%'}}></div>
                        </div>
                      </div>
                      <div class="p-3 bg-slate-50 rounded border border-slate-200">
                        <span class="text-xs font-bold text-slate-700">Experience Tenure Alignment:</span>
                        <span class="float-right text-xs font-bold text-indigo-600">15%</span>
                        <div class="w-full bg-slate-200 h-2 rounded-full mt-2">
                          <div class="bg-indigo-600 h-2 rounded-full" style={{width: '15%'}}></div>
                        </div>
                      </div>
                      <div class="p-3 bg-slate-50 rounded border border-slate-200">
                        <span class="text-xs font-bold text-slate-700">Project Portfolio Scope:</span>
                        <span class="float-right text-xs font-bold text-indigo-600">5%</span>
                        <div class="w-full bg-slate-200 h-2 rounded-full mt-2">
                          <div class="bg-indigo-600 h-2 rounded-full" style={{width: '5%'}}></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* CANDIDATE EXPLAINABILITY MODAL */}
          {selectedCandidate && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                  <div>
                    <h3 class="text-xl font-bold text-slate-900">{selectedCandidate.candidate_name}</h3>
                    <p class="text-xs text-slate-500 font-mono mt-0.5">Candidate ID: {selectedCandidate.candidate_id}</p>
                  </div>
                  <div class="text-right">
                    <span class="text-2xl font-black text-indigo-600">{selectedCandidate.overall_score}%</span>
                    <span class="block text-xs font-semibold text-slate-500">{selectedCandidate.recommendation_tier}</span>
                  </div>
                </div>

                {/* Component Breakdown */}
                <div>
                  <h4 class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">Multi-Attribute Score Breakdown</h4>
                  <div class="space-y-3">
                    {selectedCandidate.score_breakdown.map(comp => (
                      <div key={comp.name} class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between text-xs">
                          <span class="font-bold text-slate-800">{comp.name} ({Math.round(comp.weight * 100)}% Weight)</span>
                          <span class="font-mono font-semibold text-slate-700">Raw: {Math.round(comp.raw_score * 100)}% → Weighted: {comp.weighted_score * 100}%</span>
                        </div>
                        <p class="text-xs text-slate-600 mt-1">{comp.explanation}</p>
                        {comp.evidence && comp.evidence.length > 0 && (
                          <div class="mt-2 space-y-1">
                            {comp.evidence.map((ev, i) => (
                              <div key={i} class="text-[11px] text-slate-500 bg-white p-1.5 rounded border border-slate-100 font-mono">
                                ↳ {ev}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Evidence Citations */}
                <div>
                  <h4 class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Ground-Truth Snippet Evidence</h4>
                  <div class="space-y-1.5 max-h-48 overflow-y-auto">
                    {selectedCandidate.skill_evidences.map(ev => (
                      <div key={ev.skill} class={`p-2 rounded text-xs border ${
                        ev.status === "matched" ? "bg-emerald-50/50 border-emerald-200" : "bg-rose-50/50 border-rose-200 text-rose-700"
                      }`}>
                        <span class="font-bold">{ev.is_required ? "[Mandatory]" : "[Preferred]"} {ev.skill}: </span>
                        <span>{ev.source_snippet || "Not mentioned in resume text."}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Uncertainty & Limitations */}
                <div class="p-3 bg-amber-50 rounded-lg border border-amber-200 text-xs text-amber-800 space-y-1">
                  <span class="font-bold block">Audited Limitations & Disclaimers:</span>
                  {selectedCandidate.limitations_and_uncertainties.map((lim, idx) => (
                    <div key={idx}>• {lim}</div>
                  ))}
                </div>

                <div class="text-right pt-2 border-t border-slate-100">
                  <button
                    onClick={() => setSelectedCandidate(null)}
                    class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-semibold transition-colors"
                  >
                    Close Explainability Report
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* COMPARISON MODAL */}
          {compareData && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                  <div>
                    <h3 class="text-xl font-bold text-slate-900">Side-by-Side Candidate Comparison</h3>
                    <p class="text-xs text-slate-500">Evaluated against "{compareData.job_title}"</p>
                  </div>
                  <button onClick={() => setCompareData(null)} class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr class="bg-slate-100 text-xs font-semibold text-slate-700 uppercase">
                        <th class="p-3 border">Skill / Criterion</th>
                        {compareData.candidates.map(c => (
                          <th key={c.candidate_id} class="p-3 border text-center">
                            <div class="font-bold text-slate-900">{c.candidate_name}</div>
                            <div class="text-base font-extrabold text-indigo-600">{c.overall_score}%</div>
                            <div class="text-[10px] text-slate-500">{c.experience_years} yrs exp</div>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 text-xs">
                      {compareData.skill_comparison_grid.map(row => (
                        <tr key={row.skill}>
                          <td class="p-2.5 border font-medium">
                            {row.skill} {row.is_required ? <span class="text-rose-500 font-bold">*</span> : <span class="text-slate-400">(pref)</span>}
                          </td>
                          {compareData.candidates.map(c => {
                            const evalItem = row.candidate_evaluations[c.candidate_name];
                            return (
                              <td key={c.candidate_id} class="p-2.5 border text-center">
                                {evalItem && evalItem.matched ? (
                                  <span class="inline-block px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold">✓ Matched</span>
                                ) : (
                                  <span class="inline-block px-2 py-0.5 bg-rose-50 text-rose-600 rounded">✗ Missing</span>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div class="text-right pt-2 border-t border-slate-100">
                  <button
                    onClick={() => setCompareData(null)}
                    class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-semibold transition-colors"
                  >
                    Close Comparison
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
